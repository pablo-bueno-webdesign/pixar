<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Pixar | Home</title>
</head>

<body>

    <header class="header">

        <a class="logo" href="#" title="Logo Pixar">
            <img src="./assets/logo-pixar.png" alt="Logo Pixar">
        </a>

        <nav class="menu">
            <button class="hamburger-menu">MENU</button>
            <ul class="menu-links">
                <li> <a href="#" title="Feature films">Feature films</a></li>
                <li> <a href="#" title="Short Films">Short Films</a></li>
                <li> <a href="#" title="Technology">Technology</a></li>
                <li> <a href="#" title="Careers">Careers</a></li>
                <li> <a href="#" title="Extras">Extras</a></li>
                <li> <a href="#" title="About">About</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h1 class="hero-title">
                <img src="./assets/insideout-logo.png" alt="inside out title">
            </h1>
        </section>

        <section class="projects">
            <ul class="project-wrapper">
                <li class="project">
                    <img class="project-img" src="./assets/Hoopers.png" alt="Hoopers Film">
                    <h2 class="project-title">Hoppers</h2>
                </li>
                <li class="project">
                    <img class="project-img" src="./assets/Toystory.png" alt="Toy Story Film">
                    <h2 class="project-title">Toy Story</h2>
                </li>
                <li class="project">
                    <img class="project-img" src="./assets/Winlose.png" alt="Win or Lose Film">
                    <h2 class="project-title">Win or Lose</h2>
                </li>
            </ul>
        </section>

    </main>

    <footer class="footer">

        <nav class="rrss">
            <ul class="rrss-list">
                <li><a class="rrss-link" href="#">
                        <img src="./assets/facebook.svg" alt="logo Facebook">
                    </a></li>
                <li><a class="rrss-link" href="#">
                        <img src="./assets/instagram.svg" alt="logo Instagram">
                    </a></li>
                <li><a class="rrss-link" href="#">
                        <img src="./assets/twitter.svg" alt="logo X">
                    </a></li>
                <li><a class="rrss-link" href="#">
                        <img src="./assets/youtube.svg" alt="logo Youtube">
                    </a></li>
            </ul>
        </nav>

        <nav class="privacy">
            <ul class="privacy-list">
                <li><a class="privacy-link" href="#">Privacy policy</a></li>
                <li><a class="privacy-link" href="#">Terms of use</a></li>
            </ul>
            <ul class="privacy-list">
                <li><a class="privacy-link" href="#">Your us state privacy rights</a></li>
            </ul>
            <ul class="privacy-list">
                <li><a class="privacy-link" href="#">Children's online privacy policy</a></li>
                <li><a class="privacy-link" href="#">Interest based ads</a></li>
            </ul>
        </nav>

        <p class="copyright"><small>© 1986 - 2026 Pixar / Disney</small></p>

        <button class="warning"> Do Not Sell os Share My Personal Information</button>

    </footer>


</body>

</html>
